# On push to main: build, check, and deploy to hellowoco.app.
# Production systemd unit updates require a manual root apply.
name: Build and deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Opt JS-based actions into the node24 runtime ahead of GitHub's forced flip.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # The verification steps live in verify.yml so that this deploy, the staging
  # deploy and every pull request check exactly the same things. Do not inline
  # steps here.
  build:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to hellowoco.app
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: hellowoco.app
          username: wocod
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"

            git -C /srv/woco fetch origin
            git -C /srv/woco reset --hard origin/main
            git -C /srv/woco clean -fd backend/common/migrations

            if ! diff -q /srv/woco/deploy/worldcovers.service /etc/systemd/system/worldcovers.service > /dev/null 2>&1; then
                echo "Production systemd unit differs from git."
                echo "Apply manually as root after review:"
                echo "  systemd-analyze verify /srv/woco/deploy/worldcovers.service"
                echo "  install -m 644 /srv/woco/deploy/worldcovers.service /etc/systemd/system/worldcovers.service"
                echo "  systemctl daemon-reload"
                exit 1
            fi

            service_stopped=0
            restart_if_stopped() {
                if [ "$service_stopped" -eq 1 ]; then
                    sudo -n /bin/systemctl start worldcovers || true
                fi
            }
            trap restart_if_stopped EXIT

            sudo -n /bin/systemctl stop worldcovers
            service_stopped=1
            cd /srv/woco && ./deploy/deploy.sh
            sudo -n /bin/systemctl start worldcovers
            service_stopped=0
            trap - EXIT
