# On push to main: build, check, and deploy to hellowoco.app.
# Production systemd unit updates require a manual root apply.
name: Build and deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Opt JS-based actions into the node24 runtime ahead of GitHub's forced flip.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One deploy at a time per site (issues.md 176). Six merges on 2026-09-23 ran
# six of these concurrently against the same /srv/woco; two `npm ci` in one
# node_modules collide (ENOTEMPTY) and five runs died. GitHub keeps at most
# one pending run per group and replaces it with a newer one, so the newest
# SHA always deploys. cancel-in-progress stays false on purpose: cancelling
# the runner does not reliably kill the remote script, and a kill mid-migrate
# or mid-npm-ci leaves the box half-deployed with the service stopped.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # The verification steps live in verify.yml so that this deploy, the staging
  # deploy and every pull request check exactly the same things. Do not inline
  # steps here.
  build:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Force runner DNS to 8.8.8.8 and IPv4-only
        shell: bash
        run: |
          set -euo pipefail

          # Create a systemd-resolved drop-in to prefer Google DNS and IPv4-only
          sudo mkdir -p /etc/systemd/resolved.conf.d
          sudo tee /etc/systemd/resolved.conf.d/99-github-actions.conf >/dev/null <<'EOF'
          [Resolve]
          DNS=8.8.8.8
          # Add the requested fallback address here; this is used only by systemd-resolved
          FallbackDNS=172.236.125.238
          DNSSEC=no
          DNSOverTLS=no
          MulticastDNS=no
          LLMNR=no
          # IPv4Only is available in systemd 251+; if unavailable it will be ignored
          IPv4Only=yes
          EOF

          # Restart resolver (best-effort; some hosted runners may not allow restart)
          sudo systemctl restart systemd-resolved || true

          # Check whether hellowoco.app resolves to an IPv4 address using the configured resolver
          if getent ahostsv4 hellowoco.app >/dev/null 2>&1; then
            echo "hellowoco_resolves_ipv4=true"
          else
            echo "hellowoco_resolves_ipv4=false"
          fi

      - name: Resolve deployment host
        id: deploy_host
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the FQDN if it resolves over IPv4, otherwise fall back to the provided IP
          if getent ahostsv4 hellowoco.app >/dev/null 2>&1; then
            echo "value=hellowoco.app" >> "$GITHUB_OUTPUT"
          else
            echo "value=172.236.125.238" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to hellowoco.app
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ steps.deploy_host.outputs.value }}
          username: wocod
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"

            git -C /srv/woco fetch origin
            git -C /srv/woco reset --hard origin/main
            git -C /srv/woco clean -fd backend/common/migrations

            if ! diff -q /srv/woco/deploy/worldcovers.service /etc/systemd/system/worldcovers.service > /dev/null 2>&1; then
                echo "Production systemd unit differs from git."
                echo "Apply manually as root after review:"
                echo "  systemd-analyze verify /srv/woco/deploy/worldcovers.service"
                echo "  install -m 644 /srv/woco/deploy/worldcovers.service /etc/systemd/system/worldcovers.service"
                echo "  systemctl daemon-reload"
                exit 1
            fi

            service_stopped=0
            restart_if_stopped() {
                if [ "$service_stopped" -eq 1 ]; then
                    sudo -n /bin/systemctl start worldcovers || true
                fi
            }
            trap restart_if_stopped EXIT

            sudo -n /bin/systemctl stop worldcovers
            service_stopped=1
            cd /srv/woco && ./deploy/deploy.sh
            sudo -n /bin/systemctl start worldcovers
            service_stopped=0
            trap - EXIT
