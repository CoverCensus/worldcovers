# On push to staging: build, check, and deploy to woco.dev.
# Production deploys are handled by deploy-prod.yml on main.
name: Build and deploy to staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Opt JS-based actions into the node24 runtime ahead of GitHub's forced flip.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One deploy at a time per site (issues.md 176). Six merges on 2026-09-23 ran
# six of these concurrently against the same /srv/woco; two `npm ci` in one
# node_modules collide (ENOTEMPTY) and five runs died. GitHub keeps at most
# one pending run per group and replaces it with a newer one, so the newest
# SHA always deploys. cancel-in-progress stays false on purpose: cancelling
# the runner does not reliably kill the remote script, and a kill mid-migrate
# or mid-npm-ci leaves the box half-deployed with the service stopped.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # The verification steps live in verify.yml so that this deploy and every
  # pull request check exactly the same things. Do not inline steps here.
  build:
    uses: ./.github/workflows/verify.yml
    with:
      mariadb-version: "12.3"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to woco.dev
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: woco.dev
          username: wocod
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            export PATH="$HOME/.local/bin:$PATH"

            git -C /srv/woco fetch origin
            git -C /srv/woco reset --hard origin/staging
            git -C /srv/woco clean -fd backend/common/migrations

            if ! diff -q /srv/woco/deploy/worldcovers.service /etc/systemd/system/worldcovers.service > /dev/null 2>&1; then
                echo "Updating staging systemd unit through root-owned helper..."
                sudo -n /usr/local/sbin/worldcovers-apply-unit
            fi

            service_stopped=0
            restart_if_stopped() {
                if [ "$service_stopped" -eq 1 ]; then
                    sudo -n /bin/systemctl start worldcovers || true
                fi
            }
            trap restart_if_stopped EXIT

            sudo -n /bin/systemctl stop worldcovers
            service_stopped=1
            cd /srv/woco && ./deploy/deploy.sh
            sudo -n /bin/systemctl start worldcovers
            service_stopped=0
            trap - EXIT
